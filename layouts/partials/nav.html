<nav>
    <div class="nav-container">
        <a href="/" class="nav-logo">{{ .Site.Title }}</a>
        <div class="nav-actions">
            <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">☰</button>
            <div class="nav-menu" id="nav-menu">
                {{ range .Site.Menus.main }}
                <a href="{{ .URL }}" {{ if eq $.RelPermalink .URL }}class="active"{{ end }} data-i18n-zh="{{ .Params.i18n_zh }}" data-i18n-en="{{ .Params.i18n_en }}">{{ .Name }}</a>
                {{ end }}
            </div>
            <button type="button" class="nav-btn nav-btn-search" id="search-open" aria-label="Search">🔍</button>
            <button type="button" class="nav-btn nav-btn-theme" id="theme-toggle" aria-label="Toggle theme">🌙</button>
            <button type="button" class="nav-btn nav-btn-lang" id="lang-toggle" aria-label="Toggle language">
                <span id="lang-label">EN</span>
            </button>
        </div>
    </div>
    <div class="nav-menu-overlay" id="nav-menu-overlay"></div>
</nav>
