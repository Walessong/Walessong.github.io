<style>
@font-face { font-family: '仓耳今楷02W4'; src: url('/fonts/CangErJinKai02W4.woff2') format('woff2'), url('/fonts/CangErJinKai02W4.woff') format('woff'), url('/fonts/CangErJinKai02W4.ttf') format('truetype'); font-display: swap; }
html, body {
  font-family: "仓耳今楷02W4", serif;
  scroll-behavior: smooth;
}
.nav-actions { display: flex; align-items: center; gap: 1rem; }
.nav-btn { background: none; border: 1px solid #E8E8E8; color: #6B7280; font-size: 0.875rem; font-family: inherit; padding: 0.35rem 0.65rem; border-radius: 6px; cursor: pointer; transition: color 0.2s, border-color 0.2s, box-shadow 0.2s ease, transform 0.2s ease; }
.nav-btn:hover { color: #2C5F8D; border-color: #2C5F8D; box-shadow: 0 4px 10px rgba(0,0,0,0.06); transform: translateY(-1px); }
.nav-btn-lang { min-width: 2.5rem; }

/* 移动端汉堡菜单 */
.nav-toggle { display: none; background: none; border: none; font-size: 1.5rem; color: #6B7280; cursor: pointer; padding: 0.5rem; border-radius: 8px; transition: color 0.2s, background 0.2s; }
.nav-toggle:hover { color: #2C5F8D; background: rgba(0, 0, 0, 0.05); }

@media (max-width: 768px) {
    .nav-toggle { display: block; }
    .nav-menu { 
        position: fixed; 
        top: 0; 
        right: -100%; 
        width: 80%; 
        max-width: 300px; 
        height: 100vh; 
        background: #FAFAFA; 
        flex-direction: column; 
        gap: 0; 
        padding: 4rem 2rem 2rem; 
        box-shadow: -4px 0 20px rgba(0,0,0,0.1); 
        transition: right 0.3s ease; 
        z-index: 200; 
    }
    .nav-menu.open { right: 0; }
    .nav-menu a { 
        padding: 1rem 0; 
        border-bottom: 1px solid #E8E8E8; 
        font-size: 1rem; 
        width: 100%; 
    }
    .nav-menu a:last-child { border-bottom: none; }
    .nav-menu-overlay { 
        display: none; 
        position: fixed; 
        inset: 0; 
        background: rgba(0,0,0,0.5); 
        z-index: 150; 
    }
    .nav-menu-overlay.open { display: block; }
}
.search-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; display: flex; align-items: flex-start; justify-content: center; padding: 4rem 1rem; opacity: 0; visibility: hidden; transition: opacity 0.25s, visibility 0.25s; }
.search-overlay-open { opacity: 1; visibility: visible; }
.search-modal { background: #FFF; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); width: 100%; max-width: 560px; padding: 1.5rem; position: relative; }
.search-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; color: #9CA3AF; cursor: pointer; line-height: 1; padding: 0.25rem; }
.search-close:hover { color: #2C3E50; }
.search-input { width: 100%; padding: 0.75rem 1rem; font-size: 1rem; font-family: inherit; border: 1px solid #E8E8E8; border-radius: 8px; margin-bottom: 1rem; }
.search-input:focus { outline: none; border-color: #2C5F8D; }
.search-results { max-height: 60vh; overflow-y: auto; }
.search-result-item { display: block; padding: 0.75rem 0; border-bottom: 1px solid #F3F4F6; color: #1A1A1A; text-decoration: none; transition: background 0.2s, transform 0.2s ease; }
.search-result-item:hover { background: #F8F8F8; color: #2C5F8D; transform: translateX(4px); }
.search-result-title { font-weight: 600; display: block; margin-bottom: 0.25rem; }
.search-result-meta { font-size: 0.8125rem; color: #9CA3AF; display: block; margin-bottom: 0.25rem; }
.search-result-summary { font-size: 0.875rem; color: #6B7280; display: block; line-height: 1.5; }
.search-result-empty { padding: 1.5rem; color: #9CA3AF; text-align: center; }

/* 搜索历史样式 */
.search-history { margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #F3F4F6; }
.search-history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
.search-history-header span { font-size: 0.875rem; color: #9CA3AF; font-weight: 500; }
.search-history-clear { background: none; border: none; color: #6B7280; font-size: 0.8125rem; cursor: pointer; padding: 0.25rem 0.5rem; border-radius: 4px; transition: color 0.2s, background 0.2s; }
.search-history-clear:hover { color: #2C5F8D; background: #F3F4F6; }
.search-history-items { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.search-history-item { background: #F8F8F8; border: 1px solid #E8E8E8; color: #6B7280; font-size: 0.8125rem; padding: 0.25rem 0.75rem; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
.search-history-item:hover { background: #F3F4F6; color: #2C5F8D; border-color: #2C5F8D; }

/* 搜索高亮样式 */
mark { background: #FEF3C7; color: #111827; padding: 0.1em 0.2em; border-radius: 2px; font-weight: 500; }

/* 全局链接下划线平滑动画：正文链接与文章标题 */
.content a {
  position: relative;
  text-decoration: none;
}
.content a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -0.15em;
  width: 100%;
  height: 1px;
  background-color: currentColor;
  transform-origin: left;
  transform: scaleX(0);
  transition: transform 0.2s ease-out;
}
.content a:hover::after {
  transform: scaleX(1);
}

.post-item .post-title {
  position: relative;
}
.post-item .post-title::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -0.2em;
  width: 100%;
  height: 1px;
  background-color: currentColor;
  transform-origin: left;
  transform: scaleX(0);
  transition: transform 0.2s ease-out;
}
.post-item:hover .post-title::after {
  transform: scaleX(1);
}

/* 页面加载淡入过渡，保持极简 */
body {
  animation: page-fade-in 0.35s ease-out;
}
@keyframes page-fade-in {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* KaTeX 数学公式：在小屏幕下避免横向撑爆 */
.katex-display {
  overflow-x: auto;
  overflow-y: hidden;
  padding: 0.5rem 0;
}
.katex-display > .katex {
  max-width: 100%;
}

/* Mermaid 流程图：保证 SVG 自适应宽度 */
pre.mermaid,
.mermaid {
  display: block;
  max-width: 100%;
  overflow-x: auto;
  padding: 0.5rem 0;
}
.mermaid svg {
  max-width: 100%;
  height: auto;
}

@media (max-width: 768px) { .nav-actions { gap: 0.5rem; } .nav-btn span { display: none; }

/* 触摸优化 */
.nav-btn, .nav-toggle, .search-history-item, .search-history-clear {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.search-result-item, .post-item {
    -webkit-tap-highlight-color: transparent;
}

/* 提升触摸目标大小 */
.nav-btn {
    min-width: 44px;
    min-height: 44px;
}

.nav-toggle {
    min-width: 44px;
    min-height: 44px;
}

/* 移动端优化间距 */
.search-result-item {
    padding: 1rem 0;
}

.nav-menu a {
    padding: 1.25rem 0;
    font-size: 1.1rem;
} }
</style>
