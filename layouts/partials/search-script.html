<script>
(function() {
    var LANG_KEY = 'site-lang';
    var SEARCH_HISTORY_KEY = 'search-history';
    var THEME_KEY = 'site-theme';
    var defaultLang = 'zh';
    
    function getLang() { 
        try { 
            return localStorage.getItem(LANG_KEY) || defaultLang; 
        } catch(e) { 
            return defaultLang; 
        } 
    }
    
    function setLang(lang) { 
        try { 
            localStorage.setItem(LANG_KEY, lang); 
        } catch(e) {} 
    }

    function applyLang(lang) {
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        document.querySelectorAll('[data-i18n-zh][data-i18n-en]').forEach(function(el) {
            el.textContent = el.getAttribute('data-i18n-' + lang) || el.textContent;
        });
        var label = document.getElementById('lang-label');
        if (label) label.textContent = lang === 'zh' ? 'EN' : '中文';
        var ph = document.getElementById('search-input');
        if (ph) ph.placeholder = lang === 'zh' ? '搜索文章标题、摘要、分类、标签...' : 'Search by title, summary, category, tags...';
    }

    var langToggle = document.getElementById('lang-toggle');
    if (langToggle) {
        langToggle.addEventListener('click', function() {
            var next = getLang() === 'zh' ? 'en' : 'zh';
            setLang(next);
            applyLang(next);
        });
    }
    applyLang(getLang());

    // 暗色模式切换功能
    var themeToggle = document.getElementById('theme-toggle');
    
    function getTheme() {
        try {
            return localStorage.getItem(THEME_KEY) || 'light';
        } catch(e) {
            return 'light';
        }
    }
    
    function setTheme(theme) {
        try {
            localStorage.setItem(THEME_KEY, theme);
        } catch(e) {}
        document.documentElement.setAttribute('data-theme', theme);
        if (themeToggle) {
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        }
    }
    
    function initTheme() {
        // 强制重置为浅色模式，清除可能保存的错误设置
        try {
            localStorage.removeItem(THEME_KEY);
        } catch(e) {}
        
        // 默认使用浅色模式
        setTheme('light');
    }
    
    if (themeToggle) {
        themeToggle.addEventListener('click', function() {
            var currentTheme = getTheme();
            var nextTheme = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(nextTheme);
        });
    }
    
    initTheme();

    // 移动端菜单功能
    var navToggle = document.getElementById('nav-toggle');
    var navMenu = document.getElementById('nav-menu');
    var navMenuOverlay = document.getElementById('nav-menu-overlay');

    function toggleNavMenu() {
        if (navMenu) navMenu.classList.toggle('active');
        if (navMenuOverlay) navMenuOverlay.classList.toggle('active');
        document.body.style.overflow = navMenu && navMenu.classList.contains('active') ? 'hidden' : '';
    }

    if (navToggle) navToggle.addEventListener('click', toggleNavMenu);
    if (navMenuOverlay) navMenuOverlay.addEventListener('click', toggleNavMenu);

    var navMenuLinks = document.querySelectorAll('.nav-menu a');
    navMenuLinks.forEach(function(link) {
        link.addEventListener('click', function() {
            if (navMenu && navMenu.classList.contains('active')) {
                toggleNavMenu();
            }
        });
    });

    // 搜索功能
    var overlay = document.getElementById('search-overlay');
    var searchOpen = document.getElementById('search-open');
    var searchClose = document.getElementById('search-close');
    var searchInput = document.getElementById('search-input');
    var searchResults = document.getElementById('search-results');
    var searchDataEl = document.getElementById('search-data');
    var searchData = searchDataEl ? JSON.parse(searchDataEl.textContent || '[]') : [];

    function getSearchHistory() {
        try {
            return JSON.parse(localStorage.getItem(SEARCH_HISTORY_KEY) || '[]');
        } catch(e) {
            return [];
        }
    }

    function saveSearchHistory(query) {
        if (!query || query.trim().length === 0) return;
        try {
            var history = getSearchHistory();
            history = history.filter(function(item) { return item !== query; });
            history.unshift(query);
            if (history.length > 10) history = history.slice(0, 10);
            localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(history));
        } catch(e) {}
    }

    function clearSearchHistory() {
        try {
            localStorage.removeItem(SEARCH_HISTORY_KEY);
        } catch(e) {}
    }

    function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function highlightText(text, query) {
        if (!query || query.trim().length === 0) return escapeHtml(text);
        var escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        var regex = new RegExp('(' + escapedQuery + ')', 'gi');
        return escapeHtml(text).replace(regex, '<mark>$1</mark>');
    }

    function openSearch() {
        if (overlay) overlay.classList.add('active');
        if (searchInput) {
            setTimeout(function() {
                searchInput.focus();
            }, 100);
        }
    }

    function closeSearch() {
        if (overlay) overlay.classList.remove('active');
        if (searchInput) searchInput.value = '';
        if (searchResults) searchResults.innerHTML = '';
    }

    // 搜索快捷键 (Ctrl+K / Cmd+K)
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            if (overlay && overlay.classList.contains('active')) {
                closeSearch();
            } else {
                openSearch();
            }
        }
        if (e.key === 'Escape' && overlay && overlay.classList.contains('active')) {
            closeSearch();
        }
    });

    if (searchOpen) searchOpen.addEventListener('click', openSearch);
    if (searchClose) searchClose.addEventListener('click', closeSearch);
    if (overlay) overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeSearch();
    });

    function runSearch(q) {
        q = (q || '').trim().toLowerCase();
        var html = '';
        var results = [];
        
        if (!q) {
            var history = getSearchHistory();
            if (history.length > 0) {
                html = '<div class="search-history">' +
                       '<div class="search-history-header">' +
                       '<span>' + (getLang() === 'zh' ? '搜索历史' : 'Search History') + '</span>' +
                       '<button class="search-history-clear" onclick="clearSearchHistory()">' + (getLang() === 'zh' ? '清除' : 'Clear') + '</button>' +
                       '</div>' +
                       '<div class="search-history-items">';
                history.forEach(function(item) {
                    html += '<button class="search-history-item" onclick="document.getElementById(\'search-input\').value=\'' + escapeHtml(item) + '\';document.getElementById(\'search-input\').dispatchEvent(new Event(\'input\'));">' + escapeHtml(item) + '</button>';
                });
                html += '</div></div>';
            } else {
                html = '<div class="search-empty">' + (getLang() === 'zh' ? '输入关键词搜索文章' : 'Enter keywords to search articles') + '</div>';
            }
            if (searchResults) searchResults.innerHTML = html;
            return;
        }

        saveSearchHistory(q);

        searchData.forEach(function(item) {
            var titleMatch = item.title.toLowerCase().indexOf(q) !== -1;
            var summaryMatch = item.summary.toLowerCase().indexOf(q) !== -1;
            var tagMatch = item.tags && item.tags.some(function(tag) { return tag.toLowerCase().indexOf(q) !== -1; });
            var categoryMatch = item.category && item.category.toLowerCase().indexOf(q) !== -1;

            if (titleMatch || summaryMatch || tagMatch || categoryMatch) {
                results.push(item);
            }
        });

        if (results.length === 0) {
            html = '<div class="search-empty">' + (getLang() === 'zh' ? '未找到相关文章' : 'No results found') + '</div>';
        } else {
            html = '<div class="search-results-list">';
            results.forEach(function(item) {
                html += '<a href="' + item.url + '" class="search-result-item">';
                html += '<div class="search-result-title">' + highlightText(item.title, q) + '</div>';
                if (item.summary) {
                    html += '<div class="search-result-summary">' + highlightText(item.summary, q) + '</div>';
                }
                if (item.tags && item.tags.length > 0) {
                    html += '<div class="search-result-tags">';
                    item.tags.forEach(function(tag) {
                        html += '<span class="search-result-tag">#' + escapeHtml(tag) + '</span>';
                    });
                    html += '</div>';
                }
                html += '</a>';
            });
            html += '</div>';
        }

        if (searchResults) searchResults.innerHTML = html;
    }

    if (searchInput) searchInput.addEventListener('input', function() { runSearch(this.value); });

    window.clearSearchHistory = clearSearchHistory;

    // 导航栏自动隐藏功能
    var nav = document.querySelector('nav');
    var lastScrollTop = 0;
    var scrollThreshold = 100;
    var scrollTimeout;

    window.addEventListener('scroll', function() {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(function() {
            var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            if (scrollTop > lastScrollTop && scrollTop > scrollThreshold) {
                // 向下滚动，隐藏导航栏
                if (nav) nav.classList.add('nav-hidden');
            } else {
                // 向上滚动，显示导航栏
                if (nav) nav.classList.remove('nav-hidden');
            }
            
            lastScrollTop = scrollTop;
        }, 10);
    });

    // 返回顶部按钮功能
    var backToTop = document.getElementById('back-to-top');
    if (backToTop) {
        window.addEventListener('scroll', function() {
            if (window.pageYOffset > 300) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        });

        backToTop.addEventListener('click', function() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    }

    // 阅读进度条功能
    var readingProgress = document.getElementById('reading-progress');
    if (readingProgress) {
        window.addEventListener('scroll', function() {
            var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            var docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            var progress = (scrollTop / docHeight) * 100;
            readingProgress.style.width = progress + '%';
        });
    }

    // 代码块复制功能
    function addCopyButtons() {
        var codeBlocks = document.querySelectorAll('pre code');
        codeBlocks.forEach(function(codeBlock) {
            var pre = codeBlock.parentElement;
            if (pre.querySelector('.copy-button')) return;
            
            var copyButton = document.createElement('button');
            copyButton.className = 'copy-button';
            copyButton.textContent = '复制';
            copyButton.setAttribute('aria-label', 'Copy code');
            
            copyButton.addEventListener('click', function() {
                var text = codeBlock.textContent;
                navigator.clipboard.writeText(text).then(function() {
                    copyButton.textContent = '已复制';
                    setTimeout(function() {
                        copyButton.textContent = '复制';
                    }, 2000);
                }).catch(function() {
                    copyButton.textContent = '复制失败';
                    setTimeout(function() {
                        copyButton.textContent = '复制';
                    }, 2000);
                });
            });
            
            pre.style.position = 'relative';
            pre.appendChild(copyButton);
        });
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', addCopyButtons);
    } else {
        addCopyButtons();
    }
})();
</script>
