<footer>
    <div class="footer-container">
        <div class="footer-content">
            <div class="footer-brand">
                <h3>{{ .Site.Title }}</h3>
                <p class="footer-description">{{ .Site.Params.description | default "Quant & Poet" }}</p>
            </div>
            
            <div class="footer-social">
                <a href="{{ .Site.Params.github | default "#" }}" target="_blank" rel="noopener noreferrer" class="footer-social-link" aria-label="GitHub">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                </a>
                <a href="{{ .Site.Params.twitter | default "#" }}" target="_blank" rel="noopener noreferrer" class="footer-social-link" aria-label="Twitter">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path>
                    </svg>
                </a>
                <a href="{{ .Site.Params.rss | default "/index.xml" }}" class="footer-social-link" aria-label="RSS">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 11a9 9 0 0 1 9 9"></path>
                        <path d="M4 4a16 16 0 0 1 16 16"></path>
                        <circle cx="5" cy="19" r="1"></circle>
                    </svg>
                </a>
            </div>
            
            <div class="footer-stats">
                <div class="footer-stat-item">
                    <span class="footer-stat-number">{{ len (where .Site.RegularPages "Kind" "page") }}</span>
                    <span class="footer-stat-label">文章</span>
                </div>
                <div class="footer-stat-item">
                    <span class="footer-stat-number">{{ len .Site.Taxonomies.categories }}</span>
                    <span class="footer-stat-label">分类</span>
                </div>
                <div class="footer-stat-item">
                    <span class="footer-stat-number">{{ len .Site.Taxonomies.tags }}</span>
                    <span class="footer-stat-label">标签</span>
                </div>
            </div>
        </div>
        
        <div class="footer-bottom">
            <p class="footer-text">© {{ now.Format "2006" }} {{ .Site.Title }}. All rights reserved.</p>
            <a href="#top" class="footer-back-to-top">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
                返回顶部
            </a>
        </div>
    </div>
</footer>
